name: Backend CI

on:
  push:
  pull_request:

jobs:
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gft
          POSTGRES_PASSWORD: gft
          POSTGRES_DB: gft
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gft -d gft"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://gft:gft@localhost:5432/gft
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Compile check
        run: python -m compileall -f -q app alembic tests

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
